name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_HUBSPOT_PORTAL_ID: "0"
          NEXT_PUBLIC_HUBSPOT_FORM_GUID: "00000000-0000-0000-0000-000000000000"
          NEXT_PUBLIC_GTM_ID: "GTM-XXXXXXX"
